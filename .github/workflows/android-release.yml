name: Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['inva_trans/**', '.github/workflows/android-release.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: inva_trans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.2.13676358'
      - name: Restore protected configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$GOOGLE_CONFIG"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/cloud-release.jks
          printf '%s' "$GOOGLE_CONFIG" | base64 --decode > android/app/google-services.json
          printf 'storeFile=cloud-release.jks\nkeyAlias=%s\nkeyPassword=%s\nstorePassword=%s\n' "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - name: Build release
        run: flutter build apk --release --build-name=1.0.3 --build-number=$((100 + GITHUB_RUN_NUMBER))
      - uses: actions/upload-artifact@v4
        with:
          name: InvaTrans-release
          path: inva_trans/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/app/cloud-release.jks android/key.properties android/app/google-services.json
