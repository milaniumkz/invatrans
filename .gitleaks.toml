[extend]
useDefault = true

# Firebase client API keys are public application configuration, not Admin credentials.
[[allowlists]]
description = "Firebase public client configuration only"
rules = ["gcp-api-key"]
paths = ['''^inva_trans/lib/backend/firebase/firebase_config\.dart$''', '''^inva_trans_admin/lib/backend/firebase/firebase_config\.dart$''', '''^inva_trans/web/index\.html$''']
